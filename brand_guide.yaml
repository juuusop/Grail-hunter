# Brändiopas (deep brand guide), yksi merkintä per brands.yaml-brändi.
# tier    = jälleenmyyntitaso: S grail/likvidi, A vahva, B hyvä, C vain halvalla, D ei katetta.
# hype    = 1–5 nykyinen kysyntä/hype, quality = 1–5 valmistuksen laatu, fake = 0–3 väärennösriski.
# kw      = malli-/aikakausi-/linja-avainsanat → kerroin. Yhdistetään brands.yaml boostiin
#           (brands.yaml voittaa, jos sama sana on molemmissa).
# Tekstikentät näkyvät oppaassa (guide.html). Numerot: Sellpy-mediaani (n), Japanin myydyt (JP, n)
# ovat 11.11.2026 ajosta (data/BRAND_REPORT.md, data/comps.json).
Carol Christian Poell:
  tier: S
  hype: 3
  quality: 5
  fake: 1
  status: Brändi hiljeni n. 2019–2021, Milanon studio myi varastoja. Tuotanto pientä, siksi tarjonta kuivuu vuosi vuodelta.
  good: Italiassa käsin tehty, kokeellisimmat nahkakäsittelyt koko alalla (object dyed, rubber-dipped, drip). Jokainen kappale on tavallaan uniikki.
  bad: 'Hinta ja kunto: object dyed -nahka halkeilee, kumikäsitellyt pinnat tahmaantuvat. Mitoitus kapea ja pitkä.'
  buy: Nahkatakit (object dyed, bias-cut), Drip Rubber -kengät ja -saappaat, In-Between -housut, kumipohjaiset derbyt, kangastakit kumisaumoilla.
  avoid: Kappaleet joiden kumipinnoite on kuoriutunut tai tahmea; hinnat yli 1500 € ilman tarkkoja kuvia.
  tells: Valkoinen pieni lappu jossa CAROL CHRISTIAN POELL tai pelkkä sisäänommeltu tunniste; usein ei näkyvää logoa. Koot italialaiset, istuu pienesti (50 ≈ M).
  kw:
    object dyed: 1.4
    drip: 1.3
    rubber: 1.2
    bias: 1.2
    prosthetic: 1.4
Guidi:
  tier: S
  hype: 4
  quality: 5
  fake: 1
  status: Vahva ja vakaa. Archive-skene käyttää Guidia peruskenkänä, uutena 900–1500 €.
  good: Hevosen- ja kangurunnahka, vegetabile-parkitus, kestää vuosikymmeniä ja muotoutuu jalkaan. Takkien nahka maailman parhaita.
  bad: Kova ja kipeä sisäänajo, koko tarkka. Monet kenkäkopiot (”Guidi style”) kirpparilla.
  buy: 788Z ja 988 -saappaat, PL1/PL2 -derbyt, 995/996 back zip, nahkatakit (horse full grain), laukut (BV06). Musta ja CV CO11T -värit myyvät parhaiten.
  avoid: Nimettömät italialaiset nahkakengät, joissa ”Guidi” vain kuvauksessa. Laura Guidi ja Guidi & Rosellini ovat eri merkkejä.
  tells: 'Sisällä ”GUIDI” leimattu, mallikoodi + koko leimana varressa. Iso koko: 43 Guidi ≈ 43–43.5, käy myös puolikkaalla pienempänä.'
