# Brändilista.
#
# value  = arvioitu tyypillinen jälleenmyyntiarvo (EUR) peruskappaleelle hyvässä kunnossa.
#          Pisteet = value × kategoriakerroin × kuntokerroin × avainsanakertoimet / hinta.
#          Hälytys tulee kun pisteet >= settings.min_score (config.yaml).
#          Esim. Guidi value 450, kengät ×1.4 → hälytys kun hinta <= 630 / 2.5 = 252 €.
# aliases = muut kirjoitusasut. Nimi itse on aina alias. Isot/pienet kirjaimet,
#           aksentit ja välimerkit eivät haittaa.
# boost   = avainsana → kerroin, jos sana löytyy tuotteen tiedoista (esim. tabi: 1.6).
# max_price = (valinnainen) kova yläraja tälle brändille.
# rare    = true: harvinainen brändi, hälyttää jo kun hinta on lähellä arvoa.
#
# Lisää brändi kopioimalla rivi ja muuttamalla nimeä. Uudet brändit löytyvät
# Sellpystä automaattisesti seuraavassa "Discover brands" -ajossa.

