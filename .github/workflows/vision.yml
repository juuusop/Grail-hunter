name: Vision (mislisted items)

# Hourly: text funnel -> CLIP image match -> optional Claude label check.
# Add an ANTHROPIC_API_KEY repo secret to turn on the label check.
on:
  schedule:
    - cron: "35 * * * *"
  push:
    paths: [vision.py, .github/workflows/vision.yml]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: vision
  cancel-in-progress: false

jobs:
  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt fastembed==0.8.1 Pillow anthropic numpy
      - name: Restore model + memory
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.cache/fastembed
            data/vision_state.json
          key: vision-v1-${{ github.run_id }}
          restore-keys: vision-v1-
      - name: Rebuild gallery weekly
        run: |
          if [ ! -f data/gallery.npz ] || [ $(( $(date +%s) - $(git log -1 --format=%ct -- data/gallery.npz 2>/dev/null || echo 0) )) -gt 604800 ]; then
            python vision.py gallery
          fi
      - name: Hunt mislisted
        run: python vision.py run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save model + memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /home/runner/.cache/fastembed
            data/vision_state.json
          key: vision-v1-${{ github.run_id }}
      - name: Commit
        run: |
          git config user.name "grail-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gallery.npz data/vision_candidates.json data/finds.json $(ls FINDS.md 2>/dev/null)
          if ! git diff --cached --quiet; then
            git commit -m "Vision results [skip ci]"
            for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break; sleep 5; done
          fi
