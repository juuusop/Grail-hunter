name: Sniper

on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:
  push:                      # run right away when settings or code change
    paths: [brands.yaml, config.yaml, sniper.py, .github/workflows/sniper.yml]

permissions:
  contents: write
  issues: write

concurrency:
  group: sniper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore memory
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: state-v3-${{ github.run_id }}
          restore-keys: state-v3-
      - name: Hunt
        run: python sniper.py run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save memory
        if: always() && hashFiles('data/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: state-v3-${{ github.run_id }}
      - name: Commit finds
        run: |
          git config user.name "grail-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ $(ls FINDS.md 2>/dev/null)
          if ! git diff --cached --quiet; then
            git commit -m "Löydöt päivitetty [skip ci]"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push
          fi
