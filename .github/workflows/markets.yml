name: Other marketplaces

# Emmy, Tori, Huuto.net, Tradera + Finn, Blocket, DBA, Marktplaats, 2dehands, every 30 min, scored with the same brand rules.
on:
  schedule:
    - cron: "12,42 * * * *"
  push:
    branches: [claude/designer-thrift-scraper-KF3Wi]
    paths: [markets.py, markets_eu.py, .github/workflows/markets.yml]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: markets
  cancel-in-progress: false

jobs:
  markets:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt Pillow
      - name: Restore memory
        uses: actions/cache/restore@v4
        with:
          path: data/markets_state.json
          key: markets-v2-${{ github.run_id }}
          restore-keys: markets-v2-
      - run: python markets.py run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Save memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/markets_state.json
          key: markets-v2-${{ github.run_id }}
      - name: Commit
        run: |
          git config user.name "grail-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/markets_scan.json data/finds.json $(ls FINDS.md 2>/dev/null)
          if ! git diff --cached --quiet; then
            git commit -m "Marketplace results [skip ci]"
            for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break; sleep 5; done
          fi
