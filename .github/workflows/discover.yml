name: Discover brands

# Brand search + evaluation. Also runs automatically inside the sniper when
# brands.yaml changes or the data is over 8 days old.
on:
  schedule:
    - cron: "17 4 * * 1"     # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sniper
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sniper.py discover
      - name: Commit report
        run: |
          git config user.name "grail-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if ! git diff --cached --quiet; then
            git commit -m "Brändiraportti päivitetty [skip ci]"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push
          fi
