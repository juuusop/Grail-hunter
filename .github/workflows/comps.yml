name: Japan comps

# Weekly: last ~100 sold items per brand on Yahoo! Auctions JP -> data/comps.json + data/COMPS.md
on:
  schedule:
    - cron: "41 3 * * 0"     # Sundays 03:41 UTC
  push:
    paths: [comps.py, .github/workflows/comps.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sniper
  cancel-in-progress: false

jobs:
  comps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python comps.py
      - name: Commit comps
        run: |
          git config user.name "grail-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/comps.json data/COMPS.md
          if ! git diff --cached --quiet; then
            git commit -m "Japanin hintavertailu päivitetty [skip ci]"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push
          fi
