name: Deep scan

# Edit ops/request.txt ("universe" or "deep") and push to run a one-off scan.
on:
  push:
    paths: [ops/request.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sniper
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt Pillow
      - run: python scan.py $(cat ops/request.txt)
      - name: Commit results
        run: |
          git config user.name "grail-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $(ls data/scan.json data/brand_universe.json 2>/dev/null)
          if ! git diff --cached --quiet; then
            git commit -m "Scan results [skip ci]"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push
          fi
