name: Deep scan

# Edit ops/request.txt ("universe" or "deep") and push to run a one-off scan.
# Also runs by itself every second night and posts only brand-new insane deals.
on:
  schedule:
    - cron: "20 3 */2 * *"
  push:
    paths: [ops/request.txt]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: deepscan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt Pillow
      - name: Scan
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then python scan.py deep; else python scan.py $(cat ops/request.txt); fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCAN_NOTIFY: ${{ github.event_name == 'schedule' && '1' || '' }}
      - name: Commit results
        run: |
          git config user.name "grail-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $(ls data/scan.json data/brand_universe.json 2>/dev/null)
          if ! git diff --cached --quiet; then
            git commit -m "Scan results [skip ci]"
            git pull --rebase --autostash -X theirs origin "${GITHUB_REF_NAME}" && git push
          fi
