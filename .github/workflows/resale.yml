name: Resale comps

# Sold comps from Huuto.net (closed auctions) + profit ranking of all finds -> data/PROFIT.md
on:
  schedule:
    - cron: "33 5 * * *"     # daily 05:33 UTC
  push:
    paths: [resale.py, resale.yaml, .github/workflows/resale.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resale
  cancel-in-progress: false

jobs:
  resale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python resale.py comps
      - run: python resale.py report
      - name: Commit
        run: |
          git config user.name "grail-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/comps.json data/PROFIT.md
          if ! git diff --cached --quiet; then
            git commit -m "Resale comps + profit ranking [skip ci]"
            for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break; sleep 5; done
          fi
