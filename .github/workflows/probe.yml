name: Probe marketplaces

on:
  push:
    paths: [ops/probe.py]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python ops/probe.py
      - name: Commit results
        run: |
          git config user.name "grail-hunter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe.json
          if ! git diff --cached --quiet; then
            git commit -m "Probe results [skip ci]"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push
          fi
