# Jälleenmyyntiarvo + kate (resale.py).
#
# Idea: "pisteet" (arvo / hinta) kertoo onko hinta halpa, mutta ei sitä, jääkö käteen rahaa.
# Tämä kerros laskee jokaiselle löydölle:
#   myyntihinta  = mallin vertailuhinta (models) tai brändin arvo × kategoria × kunto
#   netto        = paras myyntikanava: hinta × kanavan hintataso × likviditeetti − palkkiot − postikulut
#   kate         = netto − (ostohinta + ostopuolen toimituskulu)
# ja kirjoittaa jokaiseen löytöön perustelut (mistä hinta tuli, mikä kanava, kulut).
#
# Lähde-merkinnät perusteluissa:
#   "malli"     = alla olevasta mallitaulukosta (Grailed/Vestiaire-tyyppihinnat, käsin koottu arvio, EI live-dataa)
#   "huuto-myyty" = oikeat päättyneet Huuto.net-kaupat (data/comps.json, päivitetään päivittäin)
#   "brändiarvo" = brands.yaml value × kategoria × kunto (karkein)

# Hälytykseen "💰"-merkintä kun odotettu kate on vähintään tämä (EUR) ja ROI vähintään min_roi.
min_profit: 60
min_roi: 0.5

# Myyntikanavat. price = hintataso suhteessa kansainväliseen vertailuhintaan (Grailed-taso = 1.0).
# fee = prosenttipalkkio, fixed = kiinteä per kauppa, ship = myyjän postikulu, liquidity = kuinka
# todennäköisesti/nopeasti menee tällä hinnalla (alennus neuvotteluun ja odotukseen).
# Lähteet (11/2026, tarkista ajoittain): Grailed 9 % + maksunvälitys ~3,5 %; Vinted myyjälle 0 €
# (ostaja maksaa suojan + postin); Tori/Huuto: yksityismyynti ilman palkkiota, Huuto myyntipalkkio ~5-8 %.
exits:
  grailed:   {price: 1.00, fee: 0.125, fixed: 0.5, ship: 0,  liquidity: 0.80, only_tiers: [archive, designer]}
  vinted:    {price: 0.70, fee: 0.0,   fixed: 0,   ship: 0,  liquidity: 0.90}
  tori:      {price: 0.60, fee: 0.0,   fixed: 0,   ship: 0,  liquidity: 0.95}

# Ostopuolen toimituskulu per lähde (EUR). Sellpy: toimitus pakettiautomaattiin.
buy_costs:
  sellpy: 5.9
  brändi: 5.9
  haku: 5.9
  emmy: 5.9
  tori: 7.0
  huuto: 8.0
  tradera: 16.0     # Ruotsista, jos myyjä postittaa Suomeen

# Ilman mallivertailua brändiarvio on optimistinen (geneerinen kappale myy hitaammin ja halvemmalla).
generic_factor: 0.75

# Massakollaboraatiot ja diffuusiolinjat: kerroin brändiarvioon, jos sana löytyy eikä mallitaulukko osu.
# Esim. "Raf Simons x Calvin Klein", "Y-3", "Nike x Acronym" myyvät murto-osalla mainline-hinnasta.
collab_words: {nike: 0.35, adidas: 0.35, "h&m": 0.2, "h & m": 0.2, uniqlo: 0.15, gu: 0.15, "calvin klein": 0.35,
               converse: 0.3, puma: 0.35, asics: 0.4, fila: 0.3, eastpak: 0.35, fred perry: 0.4, "y-3": 0.35,
               vans: 0.35, "the north face": 0.6, moncler genius: 0.7, champion: 0.3, lacoste: 0.4}

# Brändi mainittu vain materiaalina ("tyg Loro Piana", "fabric by ...") → ei brändin tuote.
fabric_words: [tyg, fabric, kangas, cloth, stoff, fabrics, tissu, kankaasta, lanka, garn, yarn, "tyg från", "ull från"]

# Brändin "taso": archive/designer myyvät kansainvälisesti (Grailed), muut lähinnä Vinted/Tori.
# Brändit joita ei ole listattu: value >= 200 → archive, >= 90 → designer, muuten mainstream.
tier_thresholds: {archive: 200, designer: 90}

# Kategoriat, joissa jälleenmyynti toimii huonosti kulujen jälkeen (halpa tuote, paljon tarjontaa).
low_margin_categories: [t-paita, asuste]

# Mallikohtaiset vertailuhinnat: tyypillinen toteutunut myyntihinta (EUR) käytetylle hyväkuntoiselle
# kappaleelle Grailedissa/Vestiairessa. Käsin koottu arvio markkinatasosta 2024–2026, ei live-dataa.
# brand = brands.yaml nimi, words = kaikki sanat löydyttävä tuotteen tiedoista (any_words = yksikin riittää).
# Tarkempi (pidempi) osuma voittaa. why = miksi tämä kannattaa.
models:
