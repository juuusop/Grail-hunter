[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grail-hunter"
version = "2.0.0"
description = "Designer thrift scraper for Sellpy - find grails efficiently"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Grail Hunter Team" }
]
keywords = ["sellpy", "scraper", "fashion", "designer", "thrift"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    # New: Reliability & Monitoring
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
    # New: Notifications
    "python-telegram-bot>=21.0",
    "aiohttp>=3.9.0",
    # New: Scheduling
    "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
grail-hunter = "grail_hunter.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["grail_hunter"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
